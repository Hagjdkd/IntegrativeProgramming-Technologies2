<div class="dashboard-wrapper">
  <div class="website-header">
    <span class="site-name">Service Disk Pro</span>
  </div>

  <div class="main-layout">
    <aside class="sidebar-card">
      <div class="logo-container">
        <div class="logo-circle">
          <img src="./BryzztoffLogo.png" alt="Logo">
        </div>
      </div>
      <nav>
        <button class="nav-item active">Overview</button>
        <button class="nav-item">Analytics</button>
        <button class="nav-item">Settings</button>
      </nav>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </aside>

    <main class="content-area">
      <div class="welcome-card">
        <h2>Complaints Database</h2>
        
        <div class="search-container">
          <input 
            type="text" 
            placeholder="Search complaints..." 
            (input)="onSearchChange($any($event.target).value)">
        </div>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>User</th>
              <th>Issue</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            @for (item of filteredComplaints.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage); track item.id) {
              <tr>
                <td>#{{ item.id }}</td>
                <td>{{ item.user }}</td>
                <td>{{ item.issue }}</td>
                <td><span class="status-badge">{{ item.status }}</span></td>
              </tr>
            }
          </tbody>
        </table>

        <div class="pagination">
          <button [disabled]="currentPage === 1" (click)="currentPage = currentPage - 1">Prev</button>
          <span>Page {{ currentPage }} of {{ totalPages || 1 }}</span>
          <button [disabled]="currentPage >= totalPages" (click)="currentPage = currentPage + 1">Next</button>
        </div>
      </div>
    </main>
  </div>
</div>
