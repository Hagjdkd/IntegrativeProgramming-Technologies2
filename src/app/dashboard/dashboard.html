<div class="dashboard-wrapper">
  <div class="website-header">
    <span class="site-name">Service Disk Pro</span>
  </div>

  <div class="main-layout">
    <aside class="sidebar-card">
      <div class="logo-container">
        <div class="logo-circle">
          <img src="./BryzztoffLogo.png" alt="Logo">
        </div>
      </div>
      <nav>
        <button class="nav-item active">Overview</button>
        <button class="nav-item">Analytics</button>
        <button class="nav-item">Settings</button>
      </nav>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </aside>

    <main class="content-area">
      <div class="welcome-card">
        <h2>Welcome back, Admin</h2>
        <p>Your system is running smoothly.</p>
      </div>

      <div class="stats-grid">
        <div class="data-card">
          <span class="label">Total Revenue</span>
          <span class="value">₱12,450</span>
        </div>
        <div class="data-card">
          <span class="label">Active Users</span>
          <span class="value">1,102</span>
        </div>
      </div>
    </main>
  </div>
</div>
