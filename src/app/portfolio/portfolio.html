<div class="portfolio-container">
  <div class="portfolio-card">
    <h1>{{ name }}</h1>
    <div class="info-box">
      <p class="info-text"><strong>Age:</strong> <span class="highlight">{{ age }}</span></p>
      <p class="info-text"><strong>Section:</strong> <span class="highlight">{{ section }}</span></p>
      <button (click)="goBack()">← Back</button>
    </div>
  </div>
</div>
